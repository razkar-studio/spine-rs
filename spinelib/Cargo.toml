[package]
name = "spinelib"
version = "0.1.0+spec-1.0.0"
description = "The Spine data format"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.85"
repository = "https://codeberg.org/razkar/spine-rs"
categories = ["parsing", "config", "encoding"]
keywords = ["serde", "config", "spine", "serialization", "parser"]
readme = "README.md"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
spine-rs = { workspace = true }

[dev-dependencies]
serde_json = "1"
