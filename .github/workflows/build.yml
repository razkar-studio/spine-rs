name: build

on:
  push:
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libspine_abi.so

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_name: libspine_abi.so

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: spine_abi.dll

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            lib_name: spine_abi.dll

          - os: ubuntu-latest
            target: aarch64-linux-android
            lib_name: libspine_abi.so

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compilation tools
        if: runner.os == 'Linux' && !contains(matrix.target, 'android')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [[ "${{ matrix.target }}" == *android* ]]; then
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          fi
          cargo build --release --target ${{ matrix.target }} -p spine-abi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib_name }}

  macos-universal:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin -p spine-abi

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin -p spine-abi

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/libspine_abi.dylib \
            target/aarch64-apple-darwin/release/libspine_abi.dylib \
            -output dist/libspine_abi.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-apple-darwin
          path: dist/libspine_abi.dylib

  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build
        run: cargo build --release --target wasm32-unknown-unknown -p spine-abi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm32-unknown-unknown
          path: target/wasm32-unknown-unknown/release/spine_abi.wasm

  ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios x86_64-apple-ios

      - name: Build aarch64 (device)
        run: cargo build --release --target aarch64-apple-ios -p spine-abi

      - name: Build x86_64 (simulator)
        run: cargo build --release --target x86_64-apple-ios -p spine-abi

      - name: Create universal iOS static library
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-ios/release/libspine_abi.a \
            target/x86_64-apple-ios/release/libspine_abi.a \
            -output dist/libspine_abi.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-apple-ios
          path: dist/libspine_abi.a

  bundle:
    needs: [build, macos-universal, ios, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts

      - name: Bundle all libs
        shell: bash
        run: |
          mkdir -p bundle
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            cp -a "$dir" bundle/
          done
          cp include/spine.h bundle/

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: spine-abi-all
          path: bundle/
