name: build

on:
  push:
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libspine_c.so

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib_name: spine_c.dll

          - os: macos-latest
            target: x86_64-apple-darwin
            lib_name: libspine_c.dylib

          - os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libspine_c.dylib

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_name: libspine_c.so

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p spine-c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib_name }}

  bundle:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts

      - name: Bundle all libs
        shell: bash
        run: |
          mkdir -p bundle
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            cp -a "$dir" bundle/
          done
          cp include/spine.h bundle/

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: spine-c-all
          path: bundle/
